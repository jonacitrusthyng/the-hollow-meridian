name: Import verified release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official release assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output The-Hollow-Meridian-Free-Edition.epub \
            https://the-hollow-meridian.doggiepuke.chatgpt.site/The-Hollow-Meridian-Free-Edition.epub
          curl --fail --location --retry 3 --output The-Hollow-Meridian-Free-Edition.pdf \
            https://the-hollow-meridian.doggiepuke.chatgpt.site/The-Hollow-Meridian-Free-Edition.pdf
          curl --fail --location --retry 3 --output The-Hollow-Meridian-Cover.png \
            https://the-hollow-meridian.doggiepuke.chatgpt.site/the-hollow-meridian-cover.png
          curl --fail --location --retry 3 --output The-Hollow-Meridian-Share-Card.png \
            https://the-hollow-meridian.doggiepuke.chatgpt.site/og.png

      - name: Verify release integrity
        shell: bash
        run: sha256sum --check SHA256SUMS.txt

      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            The-Hollow-Meridian-Free-Edition.epub \
            The-Hollow-Meridian-Free-Edition.pdf \
            The-Hollow-Meridian-Cover.png \
            The-Hollow-Meridian-Share-Card.png
          if git diff --cached --quiet; then
            echo "Release assets are already current."
          else
            git commit -m "Add verified release assets"
            git push
          fi

      - name: Package distribution kit
        shell: bash
        run: |
          set -euo pipefail
          zip -9 The-Hollow-Meridian-Distribution-Kit.zip \
            README.md \
            CITATION.cff \
            metadata.json \
            PLATFORM-COPY.md \
            SHARING-PERMISSION.txt \
            SHA256SUMS.txt \
            The-Hollow-Meridian-Free-Edition.epub \
            The-Hollow-Meridian-Free-Edition.pdf \
            The-Hollow-Meridian-Cover.png \
            The-Hollow-Meridian-Share-Card.png

      - name: Create or update v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_assets=(
            The-Hollow-Meridian-Distribution-Kit.zip
            The-Hollow-Meridian-Free-Edition.epub
            The-Hollow-Meridian-Free-Edition.pdf
            The-Hollow-Meridian-Cover.png
            The-Hollow-Meridian-Share-Card.png
            SHA256SUMS.txt
            SHARING-PERMISSION.txt
          )
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${release_assets[@]}" --clobber
          else
            gh release create v1.0.0 "${release_assets[@]}" \
              --target "$(git rev-parse HEAD)" \
              --title "The Hollow Meridian — Free Digital Edition v1.0.0" \
              --notes "Official free digital edition of The Hollow Meridian by Jona Citrus Thyng. Complete 146,317-word novel in four parts and 30 chapters. Copyright © 2026 Jona Citrus Thyng. Free to read and share in complete, unmodified form. All other rights reserved."
          fi
